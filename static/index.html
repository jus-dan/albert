<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Albert</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="persona-select">
      <h1>Wer soll mit dir sprechen?</h1>
      <div class="persona-grid">
        <button class="persona-card" data-persona="albert">
          <img src="avatars/albert.svg" class="persona-avatar" alt="" aria-hidden="true" />
          <span class="persona-name">Albert</span>
          <span class="persona-label">männlich</span>
        </button>
        <button class="persona-card" data-persona="albertine">
          <img src="avatars/albertine.svg" class="persona-avatar" alt="" aria-hidden="true" />
          <span class="persona-name">Albertine</span>
          <span class="persona-label">weiblich</span>
        </button>
        <button class="persona-card" data-persona="alex">
          <img src="avatars/alex.svg" class="persona-avatar" alt="" aria-hidden="true" />
          <span class="persona-name">Alex</span>
          <span class="persona-label">non-binär</span>
        </button>
      </div>
    </section>

    <section id="conversation" hidden>
      <button id="back-button" type="button">&larr; Person wechseln</button>
      <h1 id="persona-heading"></h1>

      <div id="status-badge" class="status status-inactive">
        <span class="dot"></span>
        <span id="status-text">Inaktiv</span>
      </div>

      <button id="toggle-button" class="toggle-button toggle-start" type="button">Start</button>

      <p id="mode-hint" class="hint" hidden></p>
      <p id="mic-warning" class="mic-warning" hidden>
        Kein Mikrofonzugriff — Sprechen ist nicht möglich.
      </p>
      <div id="mic-indicator" class="mic-indicator" hidden>&#127908; hört zu ...</div>
      <div id="audio-debug" class="audio-debug" hidden></div>

      <div id="chat-log" class="chat-log"></div>
    </section>
  </main>
  <footer id="version-footer" class="version-footer">
    <a href="/board.html">Themen-Board</a>
    &nbsp;·&nbsp;
    <a href="/setup.html">Einstellungen</a>
    &nbsp;·&nbsp;
    <a href="/about.html">Über diese App</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/jus-dan/albert" target="_blank" rel="noopener" id="version-text"></a>
  </footer>
  <script src="app.js"></script>
  <script>
    fetch("/api/version")
      .then((r) => r.json())
      .then((d) => { document.getElementById("version-text").textContent = d.version; })
      .catch(() => {});
  </script>
</body>
</html>
