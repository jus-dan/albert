<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Albert – Debug</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { align-items: flex-start; }
  #debug-app { max-width: 820px; }
  .back-link { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  .back-link:hover { color: var(--text); }
  h1 { text-align: left; margin-top: 1rem; }
  .hint { color: var(--muted); }
  .debug-form { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
  .debug-form select, .debug-form input, .debug-form button {
    padding: 0.55rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  .debug-form input { flex: 1; min-width: 200px; }
  .debug-form button {
    cursor: pointer;
    background: var(--accent);
    color: #0b0d13;
    border: none;
    font-weight: 600;
  }
  .debug-meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1rem;
    white-space: pre-wrap;
    word-break: break-all;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
  }
  .results-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--card-border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
  <main id="debug-app">
    <a class="back-link" href="/">&larr; Zurück zu Albert</a>
    <h1>Debug: Datenbank-Suche</h1>
    <p class="hint">
      Testet direkt, was Albert per "list_entities" finden würde — ohne Umweg
      über die Sprachaufnahme. Zeigt auch die verwendete Airtable-Formel und
      die Ergebnis-Obergrenze.
    </p>
    <div class="debug-form">
      <select id="entity-type">
        <option value="organization">Organisation</option>
        <option value="initiative">Initiative</option>
        <option value="person">Person</option>
      </select>
      <input id="query" type="text" placeholder="Suchbegriff (leer = neueste Einträge)" />
      <button id="search-button" type="button">Suchen</button>
    </div>
    <div id="meta" class="debug-meta">Suche läuft …</div>
    <div id="results" class="results-wrap"></div>
  </main>
  <script>
    const entityType = document.getElementById("entity-type");
    const queryInput = document.getElementById("query");
    const searchButton = document.getElementById("search-button");
    const metaEl = document.getElementById("meta");
    const resultsEl = document.getElementById("results");

    async function runSearch() {
      metaEl.textContent = "Suche läuft …";
      resultsEl.innerHTML = "";

      const params = new URLSearchParams({ entity_type: entityType.value, query: queryInput.value });
      let data;
      try {
        const resp = await fetch(`/api/search?${params.toString()}`);
        data = await resp.json();
      } catch (err) {
        metaEl.textContent = "Fehler beim Abruf: " + err;
        return;
      }

      if (data.error) {
        metaEl.textContent = "Fehler: " + data.error;
        return;
      }

      metaEl.textContent =
        `Tabelle: ${data.table}  |  Treffer: ${data.count} (Obergrenze ${data.max_results_cap})\n` +
        `Airtable-Formel: ${data.formula || "(keine — zeigt die neuesten Einträge ohne Filter)"}`;

      if (data.results.length === 0) {
        resultsEl.textContent = "Keine Treffer.";
        return;
      }

      const columns = [];
      data.results.forEach((r) => {
        Object.keys(r).forEach((k) => {
          if (!columns.includes(k)) columns.push(k);
        });
      });

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      columns.forEach((c) => {
        const th = document.createElement("th");
        th.textContent = c;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      data.results.forEach((r) => {
        const tr = document.createElement("tr");
        columns.forEach((c) => {
          const td = document.createElement("td");
          const value = r[c];
          td.textContent = value === undefined || value === null ? "" : String(value).slice(0, 300);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      resultsEl.appendChild(table);
    }

    searchButton.addEventListener("click", runSearch);
    queryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") runSearch();
    });
    entityType.addEventListener("change", runSearch);

    runSearch();
  </script>
</body>
</html>
